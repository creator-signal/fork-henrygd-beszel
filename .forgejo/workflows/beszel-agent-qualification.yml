name: Beszel Agent Linux amd64 qualification

on:
  workflow_dispatch:
    inputs:
      source_revision:
        required: true
      release_tag:
        description: Published Creator Signal release tag that receives the signed agent manifest, for example v0.20.0-cs.1
        required: true

jobs:
  qualify:
    # Requires a separately registered protected Forgejo native Linux amd64 runner.
    runs-on: native-linux-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: { ref: creator-signal/main, fetch-depth: 0 }
      - name: Require current protected GitHub release source
        env: { SOURCE_REVISION: "${{ inputs.source_revision }}" }
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          github_branch=https://api.github.com/repos/creator-signal/fork-henrygd-beszel/branches/creator-signal%2Fmain
          curl --fail --proto '=https' --proto-redir '=https' --max-redirs 0 "$github_branch" -o github-main.json
          jq -e --arg source "$SOURCE_REVISION" 'type == "object" and .protected == true and (.commit.sha | type == "string") and .commit.sha == $source' github-main.json >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl --fail --proto '=https' --proto-redir '=https' --max-redirs 0 "https://raw.githubusercontent.com/creator-signal/fork-henrygd-beszel/$SOURCE_REVISION/.forgejo/workflows/beszel-agent-qualification.yml" -o trusted-workflow.yml
          cmp trusted-workflow.yml .forgejo/workflows/beszel-agent-qualification.yml
          git merge-base --is-ancestor a0dc19eacf6902d2f6934a3efd7ea7277198c40b HEAD
      - name: Test and build agent
        run: |
          test "$(uname -m)" = x86_64
          test "$(go env GOVERSION)" = go1.27.1
          mkdir -p internal/site/dist
          printf '<!doctype html><title>qualification</title>' > internal/site/dist/index.html
          go test ./agent ./agent/health ./internal/cmd/agent
          go test -tags=testing ./internal/hub -run '^TestAgentWebSocketIntegration$' -count=1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -o out/beszel-agent ./internal/cmd/agent
          ./out/beszel-agent --version
          CREATOR_SIGNAL_QUALIFIED_AGENT_BINARY="$PWD/out/beszel-agent" go test -tags=testing ./internal/hub -run '^TestCreatorSignalQualifiedBinary$' -count=1
          tar -C out -czf out/beszel-agent_linux_amd64.tar.gz beszel-agent
          sha256sum out/beszel-agent out/beszel-agent_linux_amd64.tar.gz > out/SHA256SUMS
      - name: Produce SPDX SBOM
        run: |
          python3 scripts/creator-signal/generate_spdx.py --binary out/beszel-agent --output out/beszel-agent_linux_amd64.spdx.json
          source_revision=$(git rev-parse HEAD)
          archive_sha256=$(sha256sum out/beszel-agent_linux_amd64.tar.gz | cut -d' ' -f1)
          binary_sha256=$(sha256sum out/beszel-agent | cut -d' ' -f1)
          sbom_sha256=$(sha256sum out/beszel-agent_linux_amd64.spdx.json | cut -d' ' -f1)
          printf '{"sourceRevision":"%s","archiveSha256":"%s","binarySha256":"%s","sbomSha256":"%s","nativeAgentSmoke":"pass","hubHandshake":"pass","metrics":"pass","runnerLabel":"native-linux-amd64"}\n' "$source_revision" "$archive_sha256" "$binary_sha256" "$sbom_sha256" > out/qualification.json
          tar -C out -czf out/beszel-agent-linux-amd64-qualification.tar.gz beszel-agent_linux_amd64.tar.gz beszel-agent_linux_amd64.spdx.json qualification.json SHA256SUMS
      # Forgejo Actions uses its compatible v3 action endpoint; GitHub v4 is not supported here.
      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        with: { name: "beszel-agent-linux-amd64-${{ inputs.source_revision }}", path: out/beszel-agent-linux-amd64-qualification.tar.gz, if-no-files-found: error }
      - name: Install the pinned release signing dependency
        run: python3 -m pip install --user 'cryptography==49.0.0'
      - name: Assemble and sign the Creator Signal release manifest
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          FORGEJO_RUN_ID: "${{ github.run_id }}"
          BESZEL_RELEASE_SIGNING_KEY: "${{ secrets.BESZEL_RELEASE_SIGNING_KEY }}"
          BESZEL_RELEASE_PUBLIC_KEY_SHA256: "${{ vars.BESZEL_RELEASE_PUBLIC_KEY_SHA256 }}"
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/beszel-release-signing-key.pem"
          umask 077
          printf '%s' "$BESZEL_RELEASE_SIGNING_KEY" > "$key"
          test -s "$key"
          python3 scripts/creator-signal/assemble_agent_release.py \
            --policy creator-signal/beszel-agent-release-policy.json \
            --qualification-dir out \
            --release-tag "$RELEASE_TAG" \
            --forgejo-run-id "$FORGEJO_RUN_ID" \
            --output out/creator-signal-beszel-agent-release.json
          python3 scripts/creator-signal/sign_agent_release.py \
            --manifest out/creator-signal-beszel-agent-release.json \
            --private-key "$key" \
            --output out/creator-signal-beszel-agent-release.signature.json
          rm -f "$key"
          observed=$(python3 -c "import json;print(json.load(open('out/creator-signal-beszel-agent-release.signature.json'))['publicKeySha256'])")
          test "$observed" = "$BESZEL_RELEASE_PUBLIC_KEY_SHA256"
      - name: Publish the signed release manifest to the GitHub release
        env:
          GH_TOKEN: "${{ secrets.CREATOR_SIGNAL_RELEASE_TOKEN }}"
          RELEASE_TAG: "${{ inputs.release_tag }}"
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            out/creator-signal-beszel-agent-release.json \
            out/creator-signal-beszel-agent-release.signature.json \
            --clobber \
            --repo creator-signal/fork-henrygd-beszel
