name: Validate Creator Signal release controls

on:
  pull_request:
    branches: [creator-signal/develop, creator-signal/main]
  push:
    branches: [creator-signal/develop, creator-signal/main]

permissions: { contents: read }

jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install the pinned release signing dependency
        run: python3 -m pip install --user 'cryptography==49.0.0'
      - run: |
          python3 scripts/creator-signal/test_beszel_release_control.py
          python3 scripts/creator-signal/test_beszel_image_release_control.py
          python3 scripts/creator-signal/test_forgejo_bundle.py
          python3 scripts/creator-signal/test_agent_release.py
          python3 -m py_compile scripts/creator-signal/forgejo_bundle.py scripts/creator-signal/generate_spdx.py scripts/creator-signal/beszel_image_release_control.py scripts/creator-signal/assemble_agent_release.py scripts/creator-signal/sign_agent_release.py
          python3 scripts/creator-signal/beszel_release_control.py
          python3 scripts/creator-signal/beszel_image_release_control.py
          test "$(git ls-remote https://github.com/henrygd/beszel.git 'refs/tags/v0.20.0^{}' | cut -f1)" = a0dc19eacf6902d2f6934a3efd7ea7277198c40b
