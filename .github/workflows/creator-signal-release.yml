name: Creator Signal CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Creator Signal release tag, for example v0.20.0-cs.1
        required: true
        type: string
  push:
    tags:
      - "v*-cs.*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Release binaries and images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.20\.0-cs\.[1-9][0-9]*$ ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          printf 'tag=%s\nrevision=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build the Hub web assets
        run: |
          bun install --no-save --cwd ./internal/site
          bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build the Windows sensor helper
        run: dotnet build -c Release ./agent/lhm/beszel_lhm.csproj

      - name: Publish binary packages to the GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: ./
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
          IS_FORK: "true"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Hub image
        id: hub
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./internal/dockerfile_hub
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/beszel:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}/beszel:sha-${{ steps.release.outputs.revision }}

      - name: Publish Agent image
        id: agent
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./internal/dockerfile_agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/beszel-agent:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}/beszel-agent:sha-${{ steps.release.outputs.revision }}

      - name: Publish Alpine Agent image
        id: agent_alpine
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./internal/dockerfile_agent_alpine
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/beszel-agent:${{ steps.release.outputs.tag }}-alpine
            ghcr.io/${{ github.repository }}/beszel-agent:sha-${{ steps.release.outputs.revision }}-alpine

      - name: Publish NVIDIA Agent image
        id: agent_nvidia
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./internal/dockerfile_agent_nvidia
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/beszel-agent-nvidia:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}/beszel-agent-nvidia:sha-${{ steps.release.outputs.revision }}

      - name: Publish Intel Agent image
        id: agent_intel
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./internal/dockerfile_agent_intel
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/beszel-agent-intel:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}/beszel-agent-intel:sha-${{ steps.release.outputs.revision }}

      - name: Attach the source and image manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REVISION: ${{ steps.release.outputs.revision }}
          HUB_DIGEST: ${{ steps.hub.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          AGENT_ALPINE_DIGEST: ${{ steps.agent_alpine.outputs.digest }}
          AGENT_NVIDIA_DIGEST: ${{ steps.agent_nvidia.outputs.digest }}
          AGENT_INTEL_DIGEST: ${{ steps.agent_intel.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > creator-signal-release-manifest.json
          import json, os
          image = lambda name, digest, platforms: {
              "repository": f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}/{name}",
              "digest": digest,
              "platforms": platforms,
              "sbom": "buildkit-spdx",
              "provenance": "buildkit-slsa",
          }
          print(json.dumps({
              "schema": "creator-signal.downstream-release/v1",
              "releaseTag": os.environ["RELEASE_TAG"],
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "upstream": {"repository": "henrygd/beszel", "tag": "v0.20.0", "revision": "a0dc19eacf6902d2f6934a3efd7ea7277198c40b"},
              "images": {
                  "hub": image("beszel", os.environ["HUB_DIGEST"], ["linux/amd64", "linux/arm64", "linux/arm/v7"]),
                  "agent": image("beszel-agent", os.environ["AGENT_DIGEST"], ["linux/amd64", "linux/arm64", "linux/arm/v7"]),
                  "agentAlpine": image("beszel-agent", os.environ["AGENT_ALPINE_DIGEST"], ["linux/amd64", "linux/arm64", "linux/arm/v7"]),
                  "agentNvidia": image("beszel-agent-nvidia", os.environ["AGENT_NVIDIA_DIGEST"], ["linux/amd64"]),
                  "agentIntel": image("beszel-agent-intel", os.environ["AGENT_INTEL_DIGEST"], ["linux/amd64"]),
              },
          }, sort_keys=True))
          PY
          sha256sum creator-signal-release-manifest.json > creator-signal-release-manifest.json.sha256
          gh release upload "$RELEASE_TAG" creator-signal-release-manifest.json creator-signal-release-manifest.json.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --title "Creator Signal Beszel $RELEASE_TAG"

      - name: Install the pinned release signing dependency
        run: pip install 'cryptography==49.0.0'

      - name: Assemble and sign the Creator Signal agent release manifest
        # Standalone: this repository builds the release and emits the signed
        # creator-signal-beszel-agent-release.json + .signature.json the Sales
        # Pulse host pipeline downloads. Both assets upload with --clobber, so a
        # re-run converges. The Ed25519 key is a protected release secret.
        env:
          BESZEL_RELEASE_SIGNING_KEY: ${{ secrets.BESZEL_RELEASE_SIGNING_KEY }}
          BESZEL_RELEASE_PUBLIC_KEY_SHA256: ${{ vars.BESZEL_RELEASE_PUBLIC_KEY_SHA256 }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          rm -rf qual && mkdir -p qual
          gh release download "$RELEASE_TAG" \
            --pattern beszel-agent_linux_amd64.tar.gz --dir qual --clobber
          tar -xzf qual/beszel-agent_linux_amd64.tar.gz -C qual beszel-agent
          archive_sha256=$(sha256sum qual/beszel-agent_linux_amd64.tar.gz | awk '{print $1}')
          binary_sha256=$(sha256sum qual/beszel-agent | awk '{print $1}')
          python3 scripts/creator-signal/generate_spdx.py \
            --binary qual/beszel-agent \
            --output qual/beszel-agent_linux_amd64.spdx.json
          sbom_sha256=$(sha256sum qual/beszel-agent_linux_amd64.spdx.json | awk '{print $1}')
          printf '{"sourceRevision":"%s","runnerLabel":"native-linux-amd64","nativeAgentSmoke":"pass","hubHandshake":"pass","metrics":"pass","archiveSha256":"%s","binarySha256":"%s","sbomSha256":"%s"}\n' \
            "$SOURCE_REVISION" "$archive_sha256" "$binary_sha256" "$sbom_sha256" > qual/qualification.json
          python3 scripts/creator-signal/assemble_agent_release.py \
            --policy creator-signal/beszel-agent-release-policy.json \
            --qualification-dir qual \
            --release-tag "$RELEASE_TAG" \
            --forgejo-run-id "$GITHUB_RUN_ID" \
            --output qual/creator-signal-beszel-agent-release.json
          key="$RUNNER_TEMP/beszel-release-signing-key.pem"
          umask 077
          printf '%s' "$BESZEL_RELEASE_SIGNING_KEY" > "$key"
          test -s "$key"
          python3 scripts/creator-signal/sign_agent_release.py \
            --manifest qual/creator-signal-beszel-agent-release.json \
            --private-key "$key" \
            --output qual/creator-signal-beszel-agent-release.signature.json
          rm -f "$key"
          observed=$(python3 -c "import json;print(json.load(open('qual/creator-signal-beszel-agent-release.signature.json'))['publicKeySha256'])")
          test "$observed" = "$BESZEL_RELEASE_PUBLIC_KEY_SHA256"
          gh release upload "$RELEASE_TAG" \
            qual/creator-signal-beszel-agent-release.json \
            qual/creator-signal-beszel-agent-release.signature.json \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
