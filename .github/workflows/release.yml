name: Make release and binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build .NET LHM executable for Windows sensors
        run: |
          dotnet build -c Release ./agent/lhm/beszel_lhm.csproj
        shell: bash

      - name: GoReleaser beszel
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: ./
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IS_FORK: ${{ github.repository_owner != 'henrygd' }}

      - name: Extract the released Linux agent
        run: |
          set -euo pipefail
          mkdir -p sbom
          tar -xzf dist/beszel-agent_linux_amd64.tar.gz -C sbom beszel-agent

      - name: Produce the SPDX SBOM for the Linux agent
        uses: anchore/sbom-action@v0
        with:
          path: sbom/beszel-agent
          format: spdx-json
          output-file: beszel-agent_linux_amd64.spdx.json
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attach the agent SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" beszel-agent_linux_amd64.spdx.json --clobber
